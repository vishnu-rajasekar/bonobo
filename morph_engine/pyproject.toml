[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-engine"
version = "0.1.0"
description = "Bonobo structural grammar engine"
requires-python = ">=3.10,<3.11"
dependencies = [
  "compas>=2.14,<2.16",
  "compas_viewer",
  "numpy",
  "scipy",
  "networkx",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

experimental-viewers = [
  "compas_view2",
  "qtpy",
  "PySide6",
  "compas_robots",
]